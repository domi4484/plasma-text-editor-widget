name: Build Plasma Widget RPM (openSUSE)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: opensuse/tumbleweed:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Restore zypper package cache
        uses: actions/cache@v4
        with:
          path: /var/cache/zypp/packages
          # Unique key per run so a fresh cache is always saved (keeps it
          # from going stale on rolling Tumbleweed), with prefix fallback
          # to reuse the most recent previous cache.
          key: zypp-packages-${{ github.run_id }}
          restore-keys: |
            zypp-packages-

      - name: Install dependencies via Zypper
        run: |
          # Keep downloaded RPMs in /var/cache/zypp/packages so they can be cached.
          zypper --non-interactive modifyrepo --all --keep-packages
          zypper --non-interactive ref
          zypper --non-interactive in --no-recommends \
            git \
            gcc-c++ \
            make \
            cmake \
            extra-cmake-modules \
            rpm-build \
            qt6-base-devel \
            qt6-declarative-devel \
            kf6-kpackage-devel \
            kf6-kcoreaddons-devel \
            kf6-ki18n-devel

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Don't rely on actions/checkout's fetch-tags to have pulled every tag
          # (observed unreliable in practice) - fetch them explicitly ourselves.
          git fetch --tags --force origin
          git tag --list

          IS_RELEASE_BUILD=true
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW_TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${{ github.ref_name }}"
          else
            # Not a release/tag build: base the version on the latest tag instead.
            IS_RELEASE_BUILD=false
            RAW_TAG=$(git describe --tags --abbrev=0) || RAW_TAG="v0.0.0"
          fi
          # RPM versions can't contain the "v" prefix (e.g. "v1.0.1" -> "1.0.1").
          VERSION="${RAW_TAG#v}"

          # Non-release builds (plain branch pushes, manual runs) aren't tied to a
          # tag, so append the run number as a build number to tell them apart
          # (RPM versions can't contain "-", so "+" is used as the separator).
          if [ "$IS_RELEASE_BUILD" = "false" ]; then
            VERSION="${VERSION}+${{ github.run_number }}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and Package RPM
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCPACK_PACKAGE_VERSION=${{ steps.version.outputs.version }}
          make -j$(nproc)
          cpack -G RPM

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plasma-text-widget-rpm
          path: build/*.rpm

      - name: Attach RPM to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.rpm
