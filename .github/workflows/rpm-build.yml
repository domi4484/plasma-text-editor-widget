name: Build Plasma Widget RPM (openSUSE)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: opensuse/tumbleweed:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore zypper package cache
        uses: actions/cache@v4
        with:
          path: /var/cache/zypp/packages
          # Unique key per run so a fresh cache is always saved (keeps it
          # from going stale on rolling Tumbleweed), with prefix fallback
          # to reuse the most recent previous cache.
          key: zypp-packages-${{ github.run_id }}
          restore-keys: |
            zypp-packages-

      - name: Install dependencies via Zypper
        run: |
          # Keep downloaded RPMs in /var/cache/zypp/packages so they can be cached.
          zypper --non-interactive modifyrepo --all --keep-packages
          zypper --non-interactive ref
          zypper --non-interactive in --no-recommends \
            gcc-c++ \
            make \
            cmake \
            extra-cmake-modules \
            rpm-build \
            qt6-base-devel \
            qt6-declarative-devel \
            kf6-kpackage-devel \
            kf6-kcoreaddons-devel \
            kf6-ki18n-devel

      - name: Build and Package RPM
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          make -j$(nproc)
          cpack -G RPM

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plasma-text-widget-rpm
          path: build/*.rpm
